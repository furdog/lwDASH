<html>
<head></head>
<body></body>
<script id="_page_loader">
function base64_decode_unicode(str) {
	return decodeURIComponent(atob(str).split('').map(function(c) {
		return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
	}).join(''));
}

function load_page()
{
	/* Create a temporary div to parse the HTML string */
	const temp_div = document.createElement('div');
	temp_div.innerHTML = base64_decode_unicode(`@ENV:LW_DASH_BASE64`);

	/* Extract meta tags */
	const meta_tags = temp_div.querySelectorAll('meta');
	meta_tags.forEach(meta_tag => {
		document.head.appendChild(meta_tag);
	});

	/* Extract style tags */
	const style_tags = temp_div.querySelectorAll('style');
	let styles = "";
	style_tags.forEach(style_tag => { styles += style_tag.textContent; });
	
	/* Insert style into head */
	const style_e = document.createElement('style');
	style_e.textContent = styles;
	document.head.appendChild(style_e);
	
	/* Extract script tags */
	const script_tags = temp_div.querySelectorAll('script');
	let scripts = "";
	script_tags.forEach(script_tag => {
					 scripts += script_tag.textContent; });
	/* Black magic (evaluates scripts in global scope) */
	(1, eval)(scripts);
}

load_page();
load_page = null;

/* Remove this <script> tag from the browser */
document.addEventListener('DOMContentLoaded', function() {
	const element = document.getElementById('_page_loader');
		element.parentNode.removeChild(element);
});
</script>
</html>
