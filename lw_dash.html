<style></style>
<script>
class network
{
	#ws; /* Websocket */

	/* If there are no messages for certain period */
	#connection_timeout_ms = 0; /* No timeout */
	#connection_timer;
	
	#is_alive     = false;
	#is_connected = false;

	/* Prevents connection timeout, when timeout is set */
	#keep_alive()
	{
		clearTimeout(this.#connection_timer);
		this.#is_alive = true;

		this.#connection_timer = setTimeout(() => {
			if (this.#is_alive == true) {
				this.on_timeout();
			}

			this.#is_alive = false;

			this.#ws.close();
		}, this.#connection_timeout_ms);
	}

	#send(id, data)
	{
		console.log(this.constructor.name + '.send: ' + id + ', ' +
								data);

		this.#ws.send(JSON.stringify([ id, data ]));
	};

	#recv(data)
	{
		console.log(this.constructor.name + '.recv: ' + data);
		data = JSON.parse(data);

		/* if it contains single message */
		if (typeof (data[0]) != "object") {
			this.on_message(data[0], data[1]);
		} else {
			/* if it contains multiple messages */
			for (var i = 0; i < data.length; i++) {
				this.on_message(data[i][0], data[i][0]);
			};
		}

		if (this.#connection_timeout_ms > 0) {
			this.#keep_alive();
		}
	}

	/* Global events (can be overriden by user) */
	on_connect()
	{
		console.log(this.constructor.name + '.on_connect')
	};
	
	on_disconnect()
	{
		console.log(this.constructor.name + '.on_disconnect')
	};
	
	on_timeout()
	{
		console.log(this.constructor.name + '.on_timeout')
	};
	
	on_error()
	{
		console.log(this.constructor.name + '.on_error')
	};
	
	on_message(id, data) {
		console.log(this.constructor.name + '.on_message')
	};

	connect(ip, timeout)
	{
		this.#connection_timeout_ms = timeout;

		this.#ws = new WebSocket(ip);

		this.#ws.onopen = (evt) =>
		{
			this.#is_connected = true;

			if (this.#connection_timeout_ms > 0) {
				this.#keep_alive();
			}

			this.on_connect();
		};

		this.#ws.onclose = (evt) =>
		{
			if (this.#is_connected == true) {
				this.#is_connected = false;
				this.on_disconnect();
			}

			/* Destroy websocket */
			this.#ws = null;

			this.connect(ip, timeout);
		};

		this.#ws.onerror = (evt) =>
		{
			if (this.#is_connected == true) {
				this.on_error();
			}
		};
		
		this.#ws.onmessage = (evt) =>
		{
			this.#recv(evt.data);
		};
	}

	constructor(ip, timeout)
	{
		this.connect(ip, timeout);
	}
}
</script>

<style></style>
<script>
let lw_dash_template_default_language = 'en';
let lw_dash_template_language         = 'en';

/* Data templates (can contain localization or service data) */
let lw_dash_literals = {};

function lw_dash_template_add_literal(name, objects)
{
	lw_dash_literals[name] = objects;
}

/* Function for formatting text */
function lw_dash_format_template(template, values) {
	/* If our template is an object, it's considered a language literal. */
	if (typeof template === 'object')
		/* If translation for lw_dash_template_language is missing,
		   use lw_dash_template_default_language */
		template = template[lw_dash_template_language] ?
			template[lw_dash_template_language] :
			template[lw_dash_template_default_language];

	/* If it's not a string, but a number or else - return as is. */
	if (typeof template !== 'string')
		return template;
    
	return template.replace(/(\^)?\{(\w+)\}/g, (_, specialChar, key) => {
		let value = lw_dash_format_template(values[key], values);

		if (typeof value === 'function') {
			return value();
		}

		if (specialChar === '^') {
			/* Convert the first letter to uppercase */
			value = value.charAt(0).toUpperCase() + value.slice(1);
		}
		return value;
	});
}

function lw_dash_template_apply(element, template) {
	element.textContent = lw_dash_format_template(template,
						      lw_dash_literals);
}

function lw_dash_template_register_element(element) {
	element.dataset.template = element.textContent;
	element.textContent = lw_dash_format_template(element.textContent,
						      lw_dash_literals);
}

function lw_dash_template_update(element) {
	lw_dash_template_apply(element, element.dataset.template);
}

/* Reapply templates to all elements with templates */
function lw_dash_template_update_all() {
	const elements = document.querySelectorAll('[data-template]');

	elements.forEach(element => { lw_dash_template_update(element) });
}

/* After page load */
document.addEventListener('DOMContentLoaded', () => {
	lw_dash_template_update_all();
});
</script>



<script>
/******************************************************************************
 * IMPOSTOR
 *****************************************************************************/
</script>
<style></style>
<script>
/** Creates a cloned element which mimics original element
    appearence and position, but lies within another parent.
    The original element is hidden unless delete() method is called.
    The impostor element is not linked with the original, thus any
    updates won't be transfered after one has been created. */
function lw_dash_impostor(element, parent) {
	/* 1. Store original visibility style to restore later */
	const original_visibility = element.style.visibility;

	/* 2. Get the original element's position and dimensions */
	const rect = element.getBoundingClientRect();

	/* 3. Clone the original element (deep clone to include children) */
	const cloned = element.cloneNode(true);

	/* 4. Hide the original element (preserving its space in the layout) */
	element.style.visibility = 'hidden';

	/* 5. Remove any ID to prevent duplicate IDs in the DOM */
	cloned.removeAttribute('id');

	/* 6. Apply fixed positioning */
	cloned.style.position = 'fixed';
	cloned.style.left     = `${rect.left}px`;
	cloned.style.top      = `${rect.top}px`;

	/* 7. Append the clone to the specified target parent */
	parent.appendChild(cloned);

	/* 8. Track original element position */
	const position_tracker = setInterval(function() {
		const original_rect = element.getBoundingClientRect();
		cloned.style.top = original_rect.top + 'px';
		cloned.style.left = original_rect.left + 'px';
	}, 0);


	/* 9. Return an object with the remove and a reference to the clone */
	return {
		remove: function() {
			cloned.parentNode.removeChild(cloned);
	
			/* Restore the original element's visibility */
			element.style.visibility = original_visibility;

			/* Stop position tracker */
			clearInterval(position_tracker);
		},
	
		self: cloned
	};
}
</script>

	/* Apply the initial scaling animation */
	animation: hint_initial_scale 0.5s ease-out 0s;

}
</style>
<script>
let lw_dash_hint_mode = false;

function lw_dash_hint_mode_enter(parent)
{
	lw_dash_hint_mode = true;

	const items = document.querySelectorAll('[data-hint]');

	/* Create impostor for each item */
	items.forEach(item => {
		item.impostor               = lw_dash_impostor(item, parent);
		item.impostor.self.onclick  = item.hint_click_action;
		item.impostor.self.classList.add('hint');

		/* Impostor should not have hint property
		   This prevents from false enumeration when removing hints */
		delete item.impostor.self.dataset.hint;
	});
}

function lw_dash_hint_mode_exit()
{
	lw_dash_hint_mode = false;

	const items = document.querySelectorAll('[data-hint]');

	/* Remove all impostors */	
	items.forEach((item, index) => {
		item.impostor.remove();
		delete item.impostor;
	});
}

function lw_dash_hint_mode_toggle() {
	if (!lw_dash_hint_mode)
		lw_dash_hint_mode_enter();
	else
		lw_dash_hint_mode_exit();
}

function lw_dash_hint_create(element, click_action)
{	
	element.hint_click_action = click_action;
	element.dataset.hint = "";
}
</script>

<script>
let _lw_dash_overlay_count = 0;

function lw_dash_overlay(parent) {
	/* Overlay element */
	const overlay_e = document.createElement('div');

	overlay_e.className = 'overlay overlay_bg'; 

	/* Append the overlay to parent */
	parent.appendChild(overlay_e);

	/* Remove with animation */
	function remove() {		
		/* Add the fade-out animation class */
		overlay_e.classList.add('overlay_fade_out');

		/* Listen for the animation end event */
		overlay_e.addEventListener('animationend', function handler() {
			if (overlay_e.parentNode) {
				overlay_e.parentNode.removeChild(overlay_e);
			}

			/* Remove the event listener to prevent memory leaks */
			overlay_e.removeEventListener('animationend', handler);
		});
	}

	return {
		self: overlay_e,

		/* methods */
		remove: remove
	}
}

</script>

	/* Use ease-in for removal */

.dialog_title {

	padding: 0.5em;
	overflow: auto; /* Add scroll if content exceeds size */
}

	display: flex;
	justify-content: flex-end; /* Align options to the right */
	gap: 0.5em; /* Space between option buttons */
}

	padding: 0.5em 1em;
	border: 1px solid #777;
	border-radius: 1em;
	cursor: pointer;
	background: #000a;
	color: #fff;

<script>
function lw_dash_dialog(parent, title, options)
{
	/* Dialog element */
	const dialog_e = document.createElement('div');
	dialog_e.className = 'dialog';

	/* Title element */
	const title_e = document.createElement('div');
	title_e.className = 'dialog_title';
	title_e.textContent = title;

	/* Content element */
	const content_e = document.createElement('div');
	content_e.className = 'dialog_content';

	/* Options container element */
	const options_e = document.createElement('div');
	options_e.className = 'dialog_options';

	/* Store references to individual option elements */
	const option_elements = {};

	/* Create option buttons */
	if (options && Array.isArray(options)) {
		options.forEach(option_text => {
			const option_button_e =
				document.createElement('button');
			option_button_e.className = 'dialog_option';
			option_button_e.textContent = option_text;
			options_e.appendChild(option_button_e);
			option_elements[option_text.toLowerCase()] =
				option_button_e; /* Store by lowercase text */
		});
	}

	/* Append title, content, and options to dialog */
	dialog_e.appendChild(title_e);
	dialog_e.appendChild(content_e);
	dialog_e.appendChild(options_e);

	/* Append dialog to parent */
	parent.appendChild(dialog_e);

	/* Remove with animation */
	function remove() {
		/* Add the slide-out animation class */
		dialog_e.classList.add('dialog_slide_out');

		/* Listen for the animation end event */
		dialog_e.addEventListener('animationend', function handler() {
			if (dialog_e.parentNode) {
				dialog_e.parentNode.removeChild(dialog_e);
			}

			/* Remove the event listener to prevent memory leaks */
			dialog_e.removeEventListener('animationend', handler);
		});
	}

	return {
		self: dialog_e,
		title: title_e,
		content: content_e,
		options: option_elements,
		
		/* methods */
		remove: remove
	};
}

</script>

<script>
/**
 * Creates a language selector widget.
 *
 * @param {HTMLElement} parent - The DOM element to which the
	language selector will be appended.
 * @param {Array<Object>} languages - An array of language objects,
	each with 'name', 'short_name', and 'flags'.
 * @param {Function} on_change - Callback function to be called when the
	language changes.
 * @returns {Object} An object containing a reference to the
	language selector element.
 */
function lw_dash_language_selector(parent, languages, on_change) {
	/* Language selector container element */
	const self = document.createElement('div');
	self.className = 'language_selector';

	/* Current active language index */
	let current_language_index = 0;

	/* Tooltip element for the currently displayed language */
	const tooltip_e = document.createElement('div');
	tooltip_e.className = 'language_selector_item_tooltip';
	self.appendChild(tooltip_e);

	/* Container for the actual language display (flag + short name) */
	const display_container_e = document.createElement('div');
	display_container_e.style.display = 'flex';
	display_container_e.style.alignItems = 'center';
	display_container_e.style.gap = '0.3em';

	const flag_e = document.createElement('span');
	flag_e.className = 'language_selector_item_flag';
	display_container_e.appendChild(flag_e);

	const short_name_e = document.createElement('span');
	short_name_e.className = 'language_selector_item_short_name';
	display_container_e.appendChild(short_name_e);

	self.appendChild(display_container_e);

	/**
	 * Updates the displayed language based on the current_language_index.
	 */
	function update_display() {
		const current_language = languages[current_language_index];
		flag_e.innerHTML = current_language.flag;
		short_name_e.textContent = 
			current_language.short_name.toUpperCase();
		
		/* Update tooltip as well */
		tooltip_e.textContent = current_language.name;
	}

	/**
	 * Cycles to the next language in the list.
	 */
	function cycle_language() {
		current_language_index =
			(current_language_index + 1) % languages.length;

		update_display();

		/* Call the provided on_change callback */
		if (typeof on_change === 'function') {
			on_change(
				languages[current_language_index].short_name);
		}
	}

	/* Handle click event on the selector itself */
	self.addEventListener('click', cycle_language);

	/* Initial display setup */
	update_display();

	/* Append selector to parent */
	parent.appendChild(self);

	return {
		self: self,
	};
}
</script>

<script>
const net = new network("ws://10.10.10.10/ws", 10000);

function net_dialog()
{
	const net_overlay = lw_dash_overlay(document.body);
	const net_dialog  = lw_dash_dialog(net_overlay.self, "Network",
					   ["okeh"]);
	lw_dash_loader(net_dialog.content);
	const net_text = lw_dash_text(net_dialog.content,
				     "Attempting to connect...");

	/* Show overlay on top of everything (as it is very important) */
	net_overlay.self.style.zIndex = 999;

	function remove() {
		net_dialog.remove();
		net_overlay.remove();
		net_text.remove();
	}

	net_dialog.options.okeh.onclick = remove;

	return {
		overlay: net_overlay,
		dialog: net_dialog,
		
		remove: remove
	}
}

net_dial = net_dialog();

net.on_connect = function () {
	net_dial.remove();
};

net.on_disconnect = function () {
	net_dial = net_dialog();
};
</script>
